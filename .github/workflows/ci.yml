name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Run Tests
        shell: bash
        run: |
          cd testing
          make CC=${{ matrix.cc }}
          ./tests