name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Run Tests
        shell: bash
        run: |
          cd testing
          make CC=${{ matrix.cc }}
          ./tests

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build and Run Tests
        shell: msys2 {0}
        run: |
          cd testing
          make CC=gcc
          ./tests.exe